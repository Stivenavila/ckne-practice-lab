apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  labels:
    app: toolbox
spec:
  # hostNetwork/privileged enabled to be able to inspect iptables, routes
  # and node network namespaces as the Core Infra/CNI domain expects.
  hostNetwork: false
  containers:
    - name: toolbox
      image: ckne-toolbox:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        capabilities:
          add: ["NET_ADMIN", "NET_RAW"]
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: toolbox-hostnet
  labels:
    app: toolbox-hostnet
spec:
  # Node-network variant: useful for debugging iptables/routes/tcpdump at the
  # node level (equivalent to what you'd do with a privileged DaemonSet on the real exam).
  hostNetwork: true
  containers:
    - name: toolbox
      image: ckne-toolbox:latest
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      command: ["sleep", "infinity"]
